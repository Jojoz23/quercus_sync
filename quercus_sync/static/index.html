<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quercus Sync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="shell">
    <header class="mast">
      <div>
        <h1>Quercus Sync</h1>
        <p class="who" id="folder-hint"></p>
      </div>
      <div class="mast-side">
        <span class="pill" id="mode-pill">Demo</span>
        <p class="who" id="who">Loading…</p>
      </div>
    </header>

    <p class="banner" id="env-banner" hidden>
      No token yet. Copy <code>.env.example</code> to <code>.env</code> and set <code>QUERCUS_TOKEN</code>, then restart.
    </p>

    <section class="panel">
      <div class="panel-head">
        <h2>Courses</h2>
        <button type="button" class="text-btn" id="reload-courses">Reload</button>
      </div>
      <p class="empty" id="course-empty">No courses yet.</p>
      <div class="course-scroll">
        <ul class="courses" id="course-list"></ul>
      </div>
      <div class="actions">
        <button type="button" class="btn primary" id="sync-btn">Archive selected</button>
        <button type="button" class="btn ghost" id="sync-all">Archive all</button>
        <button type="button" class="btn stop" id="stop-btn" disabled>Stop</button>
      </div>
    </section>

    <section class="panel log-panel">
      <div class="panel-head">
        <h2>Log</h2>
        <p class="muted" id="log-meta">Idle</p>
      </div>
      <ol class="log" id="log"></ol>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Library</h2>
        <p class="muted" id="lib-root"></p>
      </div>
      <p class="empty" id="lib-empty">Nothing downloaded yet.</p>
      <table class="library" id="library">
        <thead>
          <tr><th>Path</th><th>Kind</th><th>Size</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
