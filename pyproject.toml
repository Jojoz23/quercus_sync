[project]
name = "quercus-sync"
version = "0.1.0"
description = "Deterministic local archive of your UTM Quercus (Canvas) courses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Quercus Sync" }]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-multipart>=0.0.12",
  "rich>=13.8.0",
  "typer>=0.12.5",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
quercus-sync = "quercus_sync.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quercus_sync*"]

[tool.setuptools.package-data]
quercus_sync = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
